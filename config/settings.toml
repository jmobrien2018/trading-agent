# Non-secret settings. Safe to commit.
# Secrets (API keys) live in the OS keychain; see README.
# Put machine-specific overrides in config/settings.local.toml (git-ignored).

[app]
# Only "paper" is accepted until the Phase 8 go-live gate is passed.
mode = "paper"

[paths]
# Relative paths resolve against the project root.
data_dir = "data"
log_dir = "logs"
db_file = "data/trading_agent.sqlite3"

[broker]
name = "alpaca"
paper_base_url = "https://paper-api.alpaca.markets"
data_base_url = "https://data.alpaca.markets"

[data]
# "iex" = free real-time feed, IEX exchange only (thinner: only IEX trades make bars).
# "sip" = all US exchanges; on the free plan only data older than 15 minutes.
feed = "iex"
# Price adjustment for historical bars: raw | split | dividend | all
adjustment = "split"

[history]
# How far back `data refresh` backfills a symbol the first time it sees it.
daily_years = 5      # daily bars, for swing strategies and longer backtests
minute_days = 90     # 1-minute bars, for day strategies (~60 sessions)

[refresh]
# What `data refresh` keeps up to date. After the first backfill it only fetches new bars.
timeframes = ["1Min", "1Day"]
# Warn when a completed session's 1-minute coverage (regular hours) falls below this.
min_coverage = 0.95
# While the market is open, warn when a symbol's newest 1-minute bar is older than this.
stale_minutes = 15

[watchlist]
# Phase 1 test watchlist for data-quality checks: index ETFs plus liquid large caps.
symbols = ["SPY", "QQQ", "AAPL", "MSFT", "NVDA", "AMZN", "TSLA", "AMD"]
# symbols = ["SPY", "QQQ", "SCHD", "SPMO", "DGRO", "VTV"]

[risk]
# Placeholders. Enforced in code from Phase 4 (risk engine).
max_position_usd = 1000
max_daily_loss_usd = 200
max_open_positions = 5
max_trades_per_day = 10
